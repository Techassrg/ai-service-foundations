[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-api-starter"
version = "0.1.0"
description = "Bounded FastAPI gateway for local Ollama inference"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.68,<1", "pydantic>=1.10,<3", "uvicorn>=0.24,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "requests>=2.20,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
